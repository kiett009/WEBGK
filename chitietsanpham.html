<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chi tiết sản phẩm - Thế giới điện thoại</title>
  <link rel="shortcut icon" href="img/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.9/babel.min.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const Header = ({ user }) => (
      <header className="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div className="container mx-auto flex justify-between items-center">
          <h1 className="text-2xl font-bold">Thế giới điện thoại</h1>
          <nav className="flex items-center space-x-4">
            <a href="index.html" className="hover:underline">Trang chủ</a>
            <a href="gioithieu.html" className="hover:underline">Giới thiệu</a>
            <a href="giohang.html" className="hover:underline">Giỏ hàng</a>
            <a href="lienhe.html" className="hover:underline">Liên hệ</a>
            <a href="tintuc.html" className="hover:underline">Tin tức</a>
            {user ? (
              <div className="relative dropdown">
                <button className="hover:underline">{user.username}</button>
                <div className="dropdown-content hidden absolute bg-white text-black shadow-lg rounded mt-2 z-10">
                  <a href="nguoidung.html" className="block px-4 py-2 hover:bg-gray-100">Tài khoản</a>
                  {user.isAdmin && <a href="admin.html" className="block px-4 py-2 hover:bg-gray-100">Quản trị</a>}
                  <button className="block w-full text-left px-4 py-2 hover:bg-gray-100" onClick={() => {
                    localStorage.removeItem('currentUser'); window.location.reload();
                  }}>Đăng xuất</button>
                </div>
              </div>
            ) : (
              <a href="login.html" className="hover:underline">Đăng nhập</a>
            )}
          </nav>
        </div>
      </header>
    );

    const ProductDetail = () => {
      const [user, setUser] = useState(JSON.parse(localStorage.getItem('currentUser')) || null);
      const [product, setProduct] = useState(null);
      const [cart, setCart] = useState(JSON.parse(localStorage.getItem('cart')) || []);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const masp = params.get('masp');
        const products = JSON.parse(localStorage.getItem('products')) || [];
        const foundProduct = products.find(p => p.masp === masp);
        setProduct(foundProduct);
      }, []);

      const addToCart = () => {
        if (!product) return;
        const existing = cart.find(item => item.masp === product.masp);
        if (existing) {
          setCart(cart.map(item =>
            item.masp === product.masp ? { ...item, quantity: item.quantity + 1 } : item
          ));
        } else {
          setCart([...cart, { ...product, quantity: 1 }]);
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        alert(`Đã thêm ${product.name} vào giỏ hàng!`);
      };

      if (!product) {
        return (
          <div className="text-center text-red-500 py-20">
            <h1 className="text-2xl">Sản phẩm không tồn tại!</h1>
            <a href="index.html" className="text-blue-500 hover:underline">Quay lại trang chủ</a>
          </div>
        );
      }

      return (
        <div>
          <Header user={user} />
          <section className="container mx-auto py-8">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div>
                <img src={product.img} alt={product.name} className="w-full h-64 object-cover rounded" />
              </div>
              <div>
                <h2 className="text-2xl font-bold mb-4">{product.name}</h2>
                <p className="text-red-500 font-bold mb-2">{parseInt(product.price).toLocaleString('vi')} VNĐ</p>
                <div className="flex items-center mb-2">
                  {[...Array(5)].map((_, i) => (
                    <i key={i} className={`fa fa-star ${i < product.star ? 'text-yellow-400' : 'text-gray-300'}`}></i>
                  ))}
                  <span className="ml-2 text-gray-500">({product.rateCount})</span>
                </div>
                {product.promo.name && (
                  <p className="text-green-500 mb-2">
                    {product.promo.name === 'giamgia' ? `Giảm ${parseInt(product.promo.value).toLocaleString('vi')} VNĐ` : product.promo.value}
                  </p>
                )}
                <button
                  className="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600"
                  onClick={addToCart}
                >Thêm vào giỏ hàng</button>
                <h3 className="text-xl font-semibold mt-4 mb-2">Thông số kỹ thuật</h3>
                <ul className="list-disc pl-6">
                  {product.specs && Object.entries(product.specs).map(([key, value]) => (
                    <li key={key}>{key}: {value}</li>
                  ))}
                </ul>
              </div>
            </div>
          </section>
          <footer className="bg-gray-800 text-white py-8">
            <div className="container mx-auto text-center">
              <p>© 2025 Thế giới điện thoại. All rights reserved.</p>
              <p>Liên hệ: contact@smartphonestore.vn | Hotline: 0123 456 789</p>
            </div>
          </footer>
        </div>
      );
    };

    ReactDOM.render(<ProductDetail />, document.getElementById('root'));
  </script>
</body>
</html>
