<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liên hệ - Thế giới điện thoại</title>
  <link rel="shortcut icon" href="img/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.9/babel.min.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const Header = ({ user }) => (
      <header className="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div className="container mx-auto flex justify-between items-center">
          <h1 className="text-2xl font-bold">Thế giới điện thoại</h1>
          <nav className="flex items-center space-x-4">
            <a href="index.html" className="hover:underline">Trang chủ</a>
            <a href="gioithieu.html" className="hover:underline">Giới thiệu</a>
            <a href="giohang.html" className="hover:underline">Giỏ hàng</a>
            <a href="lienhe.html" className="hover:underline">Liên hệ</a>
            <a href="tintuc.html" className="hover:underline">Tin tức</a>
            {user ? (
              <div className="relative dropdown">
                <button className="hover:underline">{user.username}</button>
                <div className="dropdown-content hidden absolute bg-white text-black shadow-lg rounded mt-2 z-10">
                  <a href="nguoidung.html" className="block px-4 py-2 hover:bg-gray-100">Tài khoản</a>
                  {user.isAdmin && <a href="admin.html" className="block px-4 py-2 hover:bg-gray-100">Quản trị</a>}
                  <button className="block w-full text-left px-4 py-2 hover:bg-gray-100" onClick={() => {
                    localStorage.removeItem('currentUser'); window.location.reload();
                  }}>Đăng xuất</button>
                </div>
              </div>
            ) : (
              <a href="login.html" className="hover:underline">Đăng nhập</a>
            )}
          </nav>
        </div>
      </header>
    );

    const Contact = () => {
      const [user, setUser] = useState(JSON.parse(localStorage.getItem('currentUser')) || null);
      const [formData, setFormData] = useState({ name: '', email: '', message: '' });
      const [success, setSuccess] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        // Giả lập gửi liên hệ
        alert('Tin nhắn đã được gửi!');
        setSuccess('Cảm ơn bạn đã liên hệ. Chúng tôi sẽ phản hồi sớm nhất!');
        setFormData({ name: '', email: '', message: '' });
      };

      return (
        <div>
          <Header user={user} />
          <section className="container mx-auto py-8">
            <h2 className="text-2xl font-bold mb-4">Liên hệ với chúng tôi</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div>
                <h3 className="text-xl font-semibold mb-4">Thông tin liên hệ</h3>
                <p className="text-gray-700">Email: contact@smartphonestore.vn</p>
                <p className="text-gray-700">Hotline: 0123 456 789</p>
                <p className="text-gray-700">Địa chỉ: 123 Đường Công Nghệ, TP.HCM</p>
              </div>
              <div>
                <h3 className="text-xl font-semibold mb-4">Gửi tin nhắn</h3>
                {success && <p className="text-green-500 mb-4">{success}</p>}
                <form onSubmit={handleSubmit}>
                  <div className="mb-4">
                    <label className="block text-gray-700">Họ tên</label>
                    <input
                      type="text"
                      className="w-full border rounded p-2"
                      value={formData.name}
                      onChange={e => setFormData({ ...formData, name: e.target.value })}
                      required
                    />
                  </div>
                  <div className="mb-4">
                    <label className="block text-gray-700">Email</label>
                    <input
                      type="email"
                      className="w-full border rounded p-2"
                      value={formData.email}
                      onChange={e => setFormData({ ...formData, email: e.target.value })}
                      required
                    />
                  </div>
                  <div className="mb-4">
                    <label className="block text-gray-700">Tin nhắn</label>
                    <textarea
                      className="w-full border rounded p-2"
                      value={formData.message}
                      onChange={e => setFormData({ ...formData, message: e.target.value })}
                      required
                    ></textarea>
                  </div>
                  <button type="submit" className="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
                    Gửi
                  </button>
                </form>
              </div>
            </div>
          </section>
          <footer className="bg-gray-800 text-white py-8">
            <div className="container mx-auto text-center">
              <p>© 2025 Thế giới điện thoại. All rights reserved.</p>
              <p>Liên hệ: contact@smartphonestore.vn | Hotline: 0123 456 789</p>
            </div>
          </footer>
        </div>
      );
    };

    ReactDOM.render(<Contact />, document.getElementById('root'));
  </script>
</body>
</html>
