<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Thế giới điện thoại</title>
  <link rel="shortcut icon" href="img/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.9/babel.min.js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // Tạo tài khoản admin mặc định
    const users = JSON.parse(localStorage.getItem('users')) || [];
    if (!users.find(u => u.username === 'admin')) {
      users.push({
        username: 'admin', password: 'admin123', email: 'admin@smartphonestore.vn',
        firstName: 'Admin', lastName: 'User', isAdmin: true
      });
      localStorage.setItem('users', JSON.stringify(users));
    }

    const Login = () => {
      const [isLogin, setIsLogin] = useState(true);
      const [formData, setFormData] = useState({
        username: '', password: '', email: '', firstName: '', lastName: ''
      });
      const [error, setError] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (isLogin) {
          const users = JSON.parse(localStorage.getItem('users')) || [];
          const user = users.find(u => u.username === formData.username && u.password === formData.password);
          if (user) {
            localStorage.setItem('currentUser', JSON.stringify(user));
            window.location.href = 'index.html';
          } else {
            setError('Tài khoản hoặc mật khẩu không đúng!');
          }
        } else {
          const users = JSON.parse(localStorage.getItem('users')) || [];
          if (users.find(u => u.username === formData.username)) {
            setError('Tài khoản đã tồn tại!');
            return;
          }
          users.push({ ...formData, isAdmin: false });
          localStorage.setItem('users', JSON.stringify(users));
          localStorage.setItem('currentUser', JSON.stringify({ ...formData, isAdmin: false }));
          window.location.href = 'index.html';
        }
      };

      return (
        <div className="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
          <h2 className="text-2xl font-bold mb-6 text-center">{isLogin ? 'Đăng nhập' : 'Đăng ký'}</h2>
          {error && <p className="text-red-500 mb-4">{error}</p>}
          <div className="mb-4">
            <button
              className={`w-1/2 py-2 ${isLogin ? 'bg-blue-500 text-white' : 'bg-gray-200'}`}
              onClick={() => setIsLogin(true)}
            >Đăng nhập</button>
            <button
              className={`w-1/2 py-2 ${!isLogin ? 'bg-blue-500 text-white' : 'bg-gray-200'}`}
              onClick={() => setIsLogin(false)}
            >Đăng ký</button>
          </div>
          <form onSubmit={handleSubmit}>
            <div className="mb-4">
              <label className="block text-gray-700">Tài khoản</label>
              <input
                type="text"
                className="w-full border rounded p-2"
                value={formData.username}
                onChange={e => setFormData({ ...formData, username: e.target.value })}
                required
              />
            </div>
            <div className="mb-4">
              <label className="block text-gray-700">Mật khẩu</label>
              <input
                type="password"
                className="w-full border rounded p-2"
                value={formData.password}
                onChange={e => setFormData({ ...formData, password: e.target.value })}
                required
              />
            </div>
            {!isLogin && (
              <>
                <div className="mb-4">
                  <label className="block text-gray-700">Email</label>
                  <input
                    type="email"
                    className="w-full border rounded p-2"
                    value={formData.email}
                    onChange={e => setFormData({ ...formData, email: e.target.value })}
                    required
                  />
                </div>
                <div className="mb-4">
                  <label className="block text-gray-700">Họ</label>
                  <input
                    type="text"
                    className="w-full border rounded p-2"
                    value={formData.firstName}
                    onChange={e => setFormData({ ...formData, firstName: e.target.value })}
                    required
                  />
                </div>
                <div className="mb-4">
                  <label className="block text-gray-700">Tên</label>
                  <input
                    type="text"
                    className="w-full border rounded p-2"
                    value={formData.lastName}
                    onChange={e => setFormData({ ...formData, lastName: e.target.value })}
                    required
                  />
                </div>
              </>
            )}
            <button type="submit" className="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">
              {isLogin ? 'Đăng nhập' : 'Đăng ký'}
            </button>
          </form>
        </div>
      );
    };

    ReactDOM.render(<Login />, document.getElementById('root'));
  </script>
</body>
</html>
