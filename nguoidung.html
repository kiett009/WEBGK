<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tài khoản - Thế giới điện thoại</title>
  <link rel="shortcut icon" href="img/favicon.ico" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.22.9/babel.min.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const Header = ({ user }) => (
      <header className="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
        <div className="container mx-auto flex justify-between items-center">
          <h1 className="text-2xl font-bold">Thế giới điện thoại</h1>
          <nav className="flex items-center space-x-4">
            <a href="index.html" className="hover:underline">Trang chủ</a>
            <a href="gioithieu.html" className="hover:underline">Giới thiệu</a>
            <a href="giohang.html" className="hover:underline">Giỏ hàng</a>
            <a href="lienhe.html" className="hover:underline">Liên hệ</a>
            <a href="tintuc.html" className="hover:underline">Tin tức</a>
            {user ? (
              <div className="relative dropdown">
                <button className="hover:underline">{user.username}</button>
                <div className="dropdown-content hidden absolute bg-white text-black shadow-lg rounded mt-2 z-10">
                  <a href="nguoidung.html" className="block px-4 py-2 hover:bg-gray-100">Tài khoản</a>
                  {user.isAdmin && <a href="admin.html" className="block px-4 py-2 hover:bg-gray-100">Quản trị</a>}
                  <button className="block w-full text-left px-4 py-2 hover:bg-gray-100" onClick={() => {
                    localStorage.removeItem('currentUser'); window.location.reload();
                  }}>Đăng xuất</button>
                </div>
              </div>
            ) : (
              <a href="login.html" className="hover:underline">Đăng nhập</a>
            )}
          </nav>
        </div>
      </header>
    );

    const UserProfile = () => {
      const [user, setUser] = useState(JSON.parse(localStorage.getItem('currentUser')));
      const [orders, setOrders] = useState(JSON.parse(localStorage.getItem('orders')) || []);

      if (!user) {
        return (
          <div className="text-center text-red-500 py-20">
            <h1 className="text-2xl">Vui lòng đăng nhập!</h1>
            <a href="login.html" className="text-blue-500 hover:underline">Đăng nhập</a>
          </div>
        );
      }

      return (
        <div>
          <Header user={user} />
          <section className="container mx-auto py-8">
            <h2 className="text-2xl font-bold mb-4">Thông tin tài khoản</h2>
            <div className="bg-white p-4 rounded shadow mb-4">
              <p><strong>Họ tên:</strong> {user.firstName} {user.lastName}</p>
              <p><strong>Email:</strong> {user.email}</p>
              <p><strong>Tài khoản:</strong> {user.username}</p>
            </div>
            <h2 className="text-2xl font-bold mb-4">Lịch sử đơn hàng</h2>
            {orders.filter(o => o.email === user.email).length === 0 ? (
              <p className="text-gray-500">Chưa có đơn hàng nào</p>
            ) : (
              <div className="grid grid-cols-1 gap-4">
                {orders.filter(o => o.email === user.email).map(o => (
                  <div key={o.id} className="bg-white p-4 rounded shadow">
                    <p><strong>Mã đơn:</strong> {o.id}</p>
                    <p><strong>Tổng tiền:</strong> {o.total.toLocaleString('vi')} VNĐ</p>
                    <p><strong>Trạng thái:</strong> {o.status}</p>
                    <p><strong>Ngày đặt:</strong> {o.date}</p>
                  </div>
                ))}
              </div>
            )}
          </section>
          <footer className="bg-gray-800 text-white py-8">
            <div className="container mx-auto text-center">
              <p>© 2025 Thế giới điện thoại. All rights reserved.</p>
              <p>Liên hệ: contact@smartphonestore.vn | Hotline: 0123 456 789</p>
            </div>
          </footer>
        </div>
      );
    };

    ReactDOM.render(<UserProfile />, document.getElementById('root'));
  </script>
</body>
</html>
